<div class="categorias-container">
  <h1 class="titulo">Categorías de Leyendas</h1>
  <p class="subtitulo">Explora los relatos según su origen o temática.</p>

  <div class="grid-categorias">
    <div 
      *ngFor="let cat of categorias" 
      class="card-categoria" 
      [routerLink]="['/categorias', cat.nombre]"
    >
      <div class="img-wrapper">
        <img [src]="cat.img" [alt]="cat.nombre">
      </div>
      <div class="card-info">
        <h3>{{ cat.nombre }}</h3>
        <p>{{ cat.desc }}</p>
      </div>
    </div>
  </div>
</div>
