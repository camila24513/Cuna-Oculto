<div class="auth-container">
  <div class="auth-card">
    <div class="brand-header">
      <h2>CUNA OCULTO</h2>
      <p>Leyendas y mitos de Dolores Hidalgo C.I.N.</p>
    </div>

    <!-- Pestañas de Navegación -->
    <div class="tab-group">
      <button class="tab-btn active">Iniciar Sesión</button>
      <button class="tab-btn" routerLink="/register">Crea tu cuenta</button>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
      <!-- Campo Correo -->
      <div class="form-control">
        <label for="email">Correo Electrónico</label>
        <input id="email" type="email" formControlName="email" placeholder="ejemplo@correo.com">
        <span class="error-text" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
          Ingresa un correo válido.
        </span>
      </div>

      <!-- Campo Contraseña -->
      <div class="form-control">
        <label for="password">Contraseña</label>
        <input id="password" type="password" formControlName="password" placeholder="••••••••">
        <span class="error-text" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
          La contraseña debe tener al menos 6 caracteres.
        </span>
      </div>

      <div class="forgot-pass">
        <a (click)="onResetPassword()">¿Olvidaste tu contraseña?</a>
      </div>

      <!-- Alertas -->
      <div class="alert error" *ngIf="mensajeError">{{ mensajeError }}</div>
      <div class="alert success" *ngIf="mensajeExito">{{ mensajeExito }}</div>

      <!-- Botón Submit -->
      <button type="submit" class="btn-primary" [disabled]="cargando">
        {{ cargando ? 'Cargando...' : 'Iniciar Sesión' }}
      </button>

      <div class="divider"><span>o</span></div>

      <!-- Botón Google -->
      <button type="button" class="btn-google" (click)="onGoogleLogin()" [disabled]="cargando">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
        Continuar con Google
      </button>
    </form>
  </div>
</div>
