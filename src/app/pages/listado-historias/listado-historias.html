<div class="historias-container">
  <div class="main-content">
    <!-- Encabezado y Buscador -->
    <div class="header-section">
      <a routerLink="/categorias" class="btn-back">
        ← {{ esMisHistorias ? 'MIS HISTORIAS' : (categoriaSeleccionada || 'TODAS LAS HISTORIAS') }}
      </a>

      <div class="acciones-header" *ngIf="!esMisHistorias">
        <a routerLink="/mis-historias" class="btn-registrar">
          + Publicar Historia
        </a>

        <div class="search-box">
          <input
            type="text"
            placeholder="Buscar historia..."
            [(ngModel)]="textoBusqueda"
          />
        </div>
      </div>
    </div>

    <!-- Lista de Historias Filtradas -->
    <ng-container *ngIf="!esMisHistorias">
      <div class="grid-historias" *ngIf="leyendasFiltradas.length > 0; else sinResultados">
        <div *ngFor="let leyenda of leyendasFiltradas" class="card-historia">
          <div class="img-wrapper">
            <img [src]="leyenda.imagen" [alt]="leyenda.titulo" (error)="$any($event.target).src = 'imagen/fondo.jpg'" />
          </div>
          <div class="card-info">
            <h3>{{ leyenda.titulo }}</h3>
            <p>{{ leyenda.descripcion }}</p>
            <span class="badge-cat" *ngIf="leyenda.categoria">{{ leyenda.categoria }}</span>

            <!-- Controles de Audio (Reproducir, Pausa y Detener) -->
            <div class="audio-controls">
              <button (click)="reproducirVoz(leyenda)" class="btn-audio play" title="Reproducir">
                ▶️ Reproducir
              </button>
              <button (click)="pausarVoz()" class="btn-audio pause" title="Pausar">
                ⏸️ Pausa
              </button>
              <button (click)="detenerVoz()" class="btn-audio stop" title="Detener y reiniciar">
                ⏹️ Detener
              </button>
            </div>
          </div>
        </div>
      </div>

      <ng-template #sinResultados>
        <div class="empty-state">
          <p>No se encontraron historias en esta categoría.</p>
        </div>
      </ng-template>
    </ng-container>

  </div>
</div>
