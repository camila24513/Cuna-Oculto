<div class="historias-container">
  <div class="main-content">
    <!-- Lista de Historias Filtradas: SOLO se muestra si NO estamos en Mis Historias -->
    <ng-container *ngIf="!esMisHistorias">
      <div class="grid-historias" *ngIf="leyendasFiltradas.length > 0; else sinResultados">
        <div *ngFor="let leyenda of leyendasFiltradas" class="card-historia">
          <div class="img-wrapper">
            <img [src]="leyenda.imagen" [alt]="leyenda.titulo" (error)="$any($event.target).src = 'assets/fondo-patron.png'" />
          </div>
          <div class="card-info">
            <h3>{{ leyenda.titulo }}</h3>
            <p>{{ leyenda.descripcion }}</p>
            <span class="badge-cat" *ngIf="leyenda.categoria">{{ leyenda.categoria }}</span>
          </div>
        </div>
      </div>

      <ng-template #sinResultados>
        <div class="empty-state">
          <p>No se encontraron historias en esta categoría.</p>
        </div>
      </ng-template>
    </ng-container>

  </div>
</div>
