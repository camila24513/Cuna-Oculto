<div class="listado-container">
  <header class="top-header">
    <h2>CUNA OCULTO</h2>
  </header>

  <div class="main-content">
    <div class="header-navegacion">
      <a routerLink="/categorias" class="btn-back">← {{ categoriaSeleccionada || 'TODAS' }}</a>
      
      <div class="buscador-box">
        <span class="icon-search">🔍</span>
        <input 
          type="text" 
          [(ngModel)]="textoBusqueda" 
          placeholder="Buscar historia..." 
          class="input-buscador"
        />
      </div>
    </div>

    <div class="grid-historias" *ngIf="leyendasFiltradas.length > 0; else sinResultados">
      <div *ngFor="let leyenda of leyendasFiltradas" class="card-historia">
        <div class="card-img">
          <img [src]="leyenda.imagenUrl" [alt]="leyenda.titulo">
        </div>
        <div class="card-body">
          <h3>{{ leyenda.titulo }}</h3>
          <p>{{ leyenda.resumen }}</p>
          <a [routerLink]="['/leyenda', leyenda.id]" class="btn-flecha">➔</a>
        </div>
      </div>
    </div>

    <ng-template #sinResultados>
      <div class="mensaje-vacio">
        <p>No se encontraron historias registradas.</p>
      </div>
    </ng-template>
  </div>
</div>
